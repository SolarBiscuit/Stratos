modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
 modId = "${mod_id}"
 version = "${mod_version}"
 displayName = "${mod_name}"
 logoFile = "stratos.png"
 authors = "${mod_authors}"
 credits = "Made by SolarBiscuit. All Rights Reserved; unmodified jars may be included in modpacks with credit (see LICENSE)."
 description = '''${mod_description}'''
 # Optional on both sides: a client without Stratos joins a server with it, and the reverse. The forecast needs Stratos
 # on the server (the integrated server in singleplayer); the rain renderer is client-side.
 displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
  modId = "forge"
  mandatory = true
  versionRange = "${forge_version_range}"
  ordering = "NONE"
  side = "BOTH"

[[dependencies.${mod_id}]]
  modId = "minecraft"
  mandatory = true
  versionRange = "${minecraft_version_range}"
  ordering = "NONE"
  side = "BOTH"

# The Weather service, the network channel, post passes, the column field and the wind.
[[dependencies.${mod_id}]]
  modId = "atmospheralib"
  mandatory = true
  versionRange = "${lib_version_range}"
  ordering = "AFTER"
  side = "BOTH"
